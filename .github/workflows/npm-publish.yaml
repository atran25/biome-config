name: Publish to npm
run-name: Publish ${{github.ref_name}} to npm
on:
    push:
        tags:
            - "v*"

permissions:
    id-token: write # Required for the trusted publisher to npm
    contents: read

jobs:
    publish-npm:
        name: Publish to Npm
        runs-on: ubuntu-latest
        steps:
            - run: echo "Checking out repo"
            - uses: actions/checkout@v6

            - run: echo "Setting up node"
            - uses: actions/setup-node@v6
              with:
                  node-version: 26
                  registry-url: https://registry.npmjs.org/

            - run: echo "Installing dependencies"
            - run: npm ci

            - run: echo "Running npm pack dry run"
            - run: npm pack --dry-run

            - run: echo "Publishing to npm"
            - run: npm publish --access public
